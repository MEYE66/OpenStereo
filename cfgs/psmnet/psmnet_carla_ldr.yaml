DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: CarlaStereoDataset
            DATA_SPLIT: {
                TRAINING: /home/lgz/workspace/OpenStereo/dataset_split/carla_stereo/train.txt,
                EVALUATING: /home/lgz/workspace/OpenStereo/dataset_split/carla_stereo/val.txt,
                TESTING: /home/lgz/workspace/OpenStereo/dataset_split/carla_stereo/test.txt
            }
            RETURN_RIGHT_DISP: false
            MAX_DISP: 192
            MINMAX_NORM: true
            ENABLE_HDR: false

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: RandomCrop, SIZE: [ 512, 512 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 608, 800 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }

MODEL:
    NAME: PSMNet # [IAPSNet] [RAODPSMNet] [SANPSMNet]
    MAX_DISP: &max_disp 192
    FIND_UNUSED_PARAMETERS: false
    CKPT: -1
    PRETRAINED_MODEL: ''

OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 6
    FREEZE_BN: false
    SYNC_BN: true
    AMP: false
    NUM_EPOCHS: 20

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.003

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.01
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: norm
        MAX_NORM: 35
        NORM_TYPE: 2

EVALUATOR:
    BATCH_SIZE_PER_GPU: 6
    MAX_DISP: *max_disp
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TRAINER:
    EVAL_INTERVAL: 1
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 30
    LOGGER_ITER_INTERVAL: 100
    TRAIN_VISUALIZATION: False
    EVAL_VISUALIZATION: True
