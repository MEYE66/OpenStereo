DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: CarlaStereoDataset
            DATA_SPLIT: {
                # TRAINING: /home/lgz/workspace/OpenStereo/dataset_split/carla_stereo/train.txt,
                # EVALUATING: /home/lgz/workspace/OpenStereo/dataset_split/carla_stereo/val.txt,
                # TESTING: /home/lgz/workspace/OpenStereo/dataset_split/carla_stereo/val.txt,
                TRAINING: /home/lgz/workspace/OpenStereo/dataset_split/carla_600x800/train.txt,
                EVALUATING: /home/lgz/workspace/OpenStereo/dataset_split/carla_600x800/val.txt,
                TESTING: /home/lgz/workspace/OpenStereo/dataset_split/carla_600x800/val.txt
            }
            RETURN_RIGHT_DISP: false
            MAX_DISP: 192
            MINMAX_NORM: false
            ENABLE_HDR: false


    DATA_TRANSFORM:
        TRAINING:
            - { NAME: RandomCrop, SIZE: [ 512, 512 ], Y_JITTER: false} # 384 x1280 -> 320 x 768 
            # - { NAME: RandomCrop, SIZE: [ 320, 768 ], Y_JITTER: false }

            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            # - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 608, 800 ] } #  384 x 1280 
            # - { NAME: RightTopPad, SIZE: [ 384, 1280 ] }

            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            # - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }`
MODEL:
    NAME: GwcNet # [GwcNet]  [NeuralAEGwcNet] [AttAEGwcNet]
    MAX_DISP: 192
    USE_CONCAT_VOLUME: true
    CONCAT_CHANNELS: 12
    DOWNSAMPLE: 4
    NUM_GROUPS: 40
    FIND_UNUSED_PARAMETERS: false
    CKPT: -1
    PRETRAINED_MODEL: ''

OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 4 # 4 for ncc /  6 for default
    FREEZE_BN: false
    SYNC_BN: true
    AMP: false
    NUM_EPOCHS: 20

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0015

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.01
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: norm
        MAX_NORM: 35
        NORM_TYPE: 2

EVALUATOR:
    BATCH_SIZE_PER_GPU: 2
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TRAINER:
    EVAL_INTERVAL: 1
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 30
    LOGGER_ITER_INTERVAL: 100
    TRAIN_VISUALIZATION: False
    EVAL_VISUALIZATION: False
